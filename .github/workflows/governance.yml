
name: AWS Governance Terraform

on:
  pull_request:
    paths:
      - "modules/governance/**"
      - "environments/governance/**"
      - ".github/workflows/governance.yml"
      - ".github/workflows/terraform-reusable.yml"

  push:
    branches:
      - main
    paths:
      - "modules/governance/**"
      - "environments/governance/**"
      - ".github/workflows/governance.yml"
      - ".github/workflows/terraform-reusable.yml"

  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform operation'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-governance
  cancel-in-progress: false


jobs:
  deploy:
    name: Governance Terraform

    uses: ./.github/workflows/terraform-reusable.yml

    with:
      environment: governance
      working_directory: environments/governance
      state_key: landing-zone/governance/terraform.tfstate
      action: ${{ github.event.inputs.action || 'auto' }}
      terraform_version: "1.10.5"
      aws_region: "us-east-1"
      apply_enabled: true