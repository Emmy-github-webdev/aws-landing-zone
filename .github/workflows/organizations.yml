
name: AWS Organizations Terraform

on:
  pull_request:
    paths:
      - "modules/organizations/**"
      - "environments/organizations/**"
      - ".github/workflows/organizations.yml"
      - ".github/workflows/terraform-reusable.yml"

  push:
    branches:
      - main
    paths:
      - "modules/organizations/**"
      - "environments/organizations/**"
      - ".github/workflows/organizations.yml"
      - ".github/workflows/terraform-reusable.yml"

  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform operation'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-organizations
  cancel-in-progress: false


jobs:
  deploy:
    name: Organizations Terraform

    uses: ./.github/workflows/terraform-reusable.yml

    with:
      environment: organizations
      working_directory: environments/organizations
      state_key: landing-zone/organizations/terraform.tfstate
      action: ${{ github.event.inputs.action || 'auto' }}
      terraform_version: "1.10.5"
      aws_region: "us-east-1"
      apply_enabled: true