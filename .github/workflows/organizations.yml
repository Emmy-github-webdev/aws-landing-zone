
name: Organizations Terraform

on:
  pull_request:
    paths:
      - 'modules/organizations/**'
      - 'environments/organizations/**'
      - '.github/workflows/organizations.yml'

  push:
    branches:
      - main
    paths:
      - 'modules/organizations/**'
      - 'environments/organizations/**'
      - '.github/workflows/organizations.yml'

  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform operation'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-organizations
  cancel-in-progress: false

env:
  TF_VERSION: '1.10.5'
  AWS_REGION: 'us-east-1'
  TF_WORKING_DIR: 'environments/organizations'

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.action == 'destroy' && 'organizations-destroy' || 'organizations' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.action == 'plan'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -input=false -auto-approve
