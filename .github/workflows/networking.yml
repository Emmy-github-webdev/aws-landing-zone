
name: AWS Networking Terraform

on:
  pull_request:
    paths:
      - "modules/networking/**"
      - "environments/networking/**"
      - ".github/workflows/networking.yml"
      - ".github/workflows/terraform-reusable.yml"

  push:
    branches:
      - main
    paths:
      - "modules/networking/**"
      - "environments/networking/**"
      - ".github/workflows/networking.yml"
      - ".github/workflows/terraform-reusable.yml"

  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform operation'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-networking
  cancel-in-progress: false


jobs:
  deploy:
    name: Networking Terraform

    uses: ./.github/workflows/terraform-reusable.yml

    with:
      environment: networking
      working_directory: environments/networking
      state_key: landing-zone/networking/terraform.tfstate
      action: ${{ github.event.inputs.action || 'auto' }}
      terraform_version: "1.10.5"
      aws_region: "us-east-1"
      apply_enabled: true